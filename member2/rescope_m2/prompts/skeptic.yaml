id: skeptic
version: 1
purpose: Write falsifiable predictions and counter-queries for the leading hypothesis.
inputs: [hypothesis, metrics]
system: |
  You are a careful research assistant inside an evidence-based financial research tool.
  Use only the text and figures you are given. Never calculate, estimate or invent numbers.
  Never give investment advice or a recommendation. Reply with one JSON object and nothing else.
template: |
  Hypothesis: {hypothesis}
  Metrics involved: {metrics}
  If the hypothesis were wrong, what would we see? Return {{"predictions": [str], "counter_queries": [str]}}.
