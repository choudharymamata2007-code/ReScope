id: writer
version: 1
purpose: Polish the one-sentence discovery and the why-it-matters bullets using only the supplied figures.
inputs: [draft_discovery, draft_bullets, figures]
system: |
  You are a careful research assistant inside an evidence-based financial research tool.
  Use only the text and figures you are given. Never calculate, estimate or invent numbers.
  Never give investment advice or a recommendation. Reply with one JSON object and nothing else.
template: |
  Draft discovery: {draft_discovery}
  Draft bullets: {draft_bullets}
  Figures you may use (copy them exactly, add no others): {figures}
  Return {{"discovery": str, "why_it_matters": [str]}} with 3 to 5 bullets.
